<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nutrir(se) — Panel</title>
<link rel="icon" type="image/png" href="favicon-32.png" />
<link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png" />
<link rel="stylesheet" href="css/style.css?v=21" />
</head>
<body>
  <div class="shell" style="max-width: 720px;">
    <div class="topbar">
      <div class="brand">
        <img src="assets/logo/wordmark-dark.png" alt="Nutrir(se)" class="brand-logo" />
        <div class="brand-tag">panel — Stella Rovera</div>
      </div>
      <button class="btn ghost" id="logout-btn" style="display:none;">Cerrar sesión</button>
    </div>

    <!-- LOGIN -->
    <div id="login-view" style="max-width: 420px; margin: 60px auto 0;">
      <div class="card">
        <h2 style="margin-bottom: 24px;">Ingresar al panel</h2>
        <form id="login-form">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="username" />
          <label for="password">Contraseña</label>
          <input type="password" id="password" required autocomplete="current-password" />
          <button type="submit" class="btn" style="width:100%; justify-content:center;">Ingresar</button>
          <p id="login-error" class="muted" style="color: var(--danger); margin-top: 14px; display:none;"></p>
        </form>
      </div>
    </div>

    <!-- HOME: lista de pacientes -->
    <div id="dashboard-view" style="display:none;">
      <div class="row between" style="margin-bottom: 20px;">
        <h2 style="font-family: 'Playfair Display', serif; font-weight: 500; text-transform: uppercase; letter-spacing: 0.03em;">Pacientes</h2>
        <button class="btn" id="show-new-patient-btn">Añadir paciente</button>
      </div>

      <div id="new-patient-card" class="card" style="display:none; margin-bottom: 20px;">
        <h3 style="margin-bottom: 16px;">Nueva paciente</h3>
        <form id="new-patient-form">
          <label for="patient-name">Nombre</label>
          <input type="text" id="patient-name" required placeholder="Ej: María González" />

          <label>¿Qué seguimiento tendrá el paciente?</label>
          <div class="field-group" style="margin-bottom: 20px;">
            <label class="choice-row" for="tracking-alimentos">
              <input type="radio" id="tracking-alimentos" name="tracking-type" value="alimentos" />
              <span>Selección de alimentos y menú semanal</span>
            </label>
            <label class="choice-row" for="tracking-alimentos-habitos">
              <input type="radio" id="tracking-alimentos-habitos" name="tracking-type" value="alimentos_habitos" checked />
              <span>Selección de alimentos, menú semanal y hábitos</span>
            </label>
          </div>

          <div class="row" style="gap: 10px;">
            <button type="submit" class="btn">Crear y generar link</button>
            <button type="button" class="btn secondary" id="cancel-new-patient-btn">Cancelar</button>
          </div>
        </form>
      </div>

      <div id="patient-list" class="patient-list">
        <p class="muted">Cargando…</p>
      </div>
    </div>

    <hr class="section-divider" style="margin: 56px 0 40px;" />
    <div style="text-align: center; margin-top: 32px; margin-bottom: 8px;">
      <img src="assets/logo/isologo-name.png" alt="Nutrir(se) — Stella Rovera, Lic. en Nutrición" style="width: 80px; height: auto;" />
    </div>
  </div>

  <script type="module" src="js/panel.js?v=10"></script>
</body>
</html>
